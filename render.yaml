services:
  - type: web
    name: dl-hub-youtube-api
    runtime: python
    plan: free
    rootDir: youtube-api
    buildCommand: curl -fsSL https://deno.land/install.sh | sh && pip install -r requirements.txt
    startCommand: export PATH="$HOME/.deno/bin:$PATH" && gunicorn main:app --workers 1 --threads 4 --timeout 240
    healthCheckPath: /health
